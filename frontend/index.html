<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitamin's Mail · takemyvitamins.lol</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0b0d10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 1100px;
            width: 100%;
            background: rgba(18, 22, 28, 0.9);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2rem;
            padding: 2rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        /* Login */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            display: flex !important;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        #loginOverlay.hidden {
            display: none !important;
        }

        .login-box {
            background: rgba(20, 24, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2rem;
            padding: 2.5rem 3rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-box h2 {
            color: #e8e8e8;
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }

        .login-box p {
            color: #8a9aaa;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .login-box input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            color: #e8e8e8;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .login-box input:focus {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.03);
        }

        .login-box button {
            width: 100%;
            margin-top: 1rem;
            padding: 0.8rem;
            background: linear-gradient(145deg, #2a303a, #171b21);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #eaeaea;
            font-weight: 600;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-box button:hover {
            background: #2f3540;
        }

        .login-error {
            color: #d4a0a0;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            min-height: 1.5rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .header h1 {
            color: #ececec;
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header .domain-tag {
            background: rgba(255, 255, 255, 0.04);
            color: #8aa8c0;
            font-size: 0.7rem;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header .logout-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #8a9aaa;
            padding: 0.3rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .header .logout-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #e8e8e8;
        }

        /* API Key Bar */
        .api-bar {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .api-bar .status {
            color: #8a9aaa;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .api-bar .status .key-status {
            color: #d4a0a0;
            font-weight: 500;
        }

        .api-bar .status .key-status.set {
            color: #8aa8c0;
        }

        .api-bar .set-key-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #8a9aaa;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .api-bar .set-key-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #e8e8e8;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1.5rem;
        }

        /* Inbox */
        .inbox {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 1.5rem;
            padding: 1rem 0.5rem 0.5rem 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0.5rem 0.5rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .inbox-header h3 {
            color: #ccd6e0;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .inbox-header .refresh {
            background: transparent;
            border: none;
            color: #6a7a8a;
            cursor: pointer;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            transition: 0.2s;
        }

        .inbox-header .refresh:hover {
            color: #ccd6e0;
            background: rgba(255, 255, 255, 0.03);
        }

        .inbox-tabs {
            display: flex;
            gap: 0.3rem;
            padding: 0 0.5rem 0.5rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .inbox-tabs button {
            background: transparent;
            border: none;
            color: #6a7a8a;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .inbox-tabs button:hover {
            color: #ccd6e0;
            background: rgba(255, 255, 255, 0.03);
        }

        .inbox-tabs button.active {
            color: #e8e8e8;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .message-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding-right: 0.2rem;
            max-height: 380px;
        }

        .message-list li {
            background: rgba(18, 22, 28, 0.4);
            padding: 0.7rem 0.9rem;
            margin: 0 0.2rem 0.3rem 0.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: 0.15s;
        }

        .message-list li:hover {
            border-color: rgba(255, 255, 255, 0.06);
            background: rgba(30, 36, 44, 0.5);
        }

        .message-list .sender {
            font-weight: 600;
            color: #e0e8f0;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .message-list .sender small {
            font-weight: 400;
            color: #6a7a8a;
            font-size: 0.65rem;
        }

        .message-list .subject {
            color: #c8d4e0;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-list .preview {
            color: #7a8a9a;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message-list .to-info {
            color: #5a6a7a;
            font-size: 0.65rem;
            margin-top: 0.2rem;
        }

        .empty-state {
            text-align: center;
            color: #5a6a7a;
            padding: 2rem 0.5rem;
            font-size: 0.85rem;
        }

        /* Compose */
        .compose {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 1.5rem;
            padding: 1.25rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .compose h3 {
            color: #ccd6e0;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 0.8rem;
        }

        .form-group label {
            display: block;
            color: #7a8a9a;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.2rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e8f0;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.4);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #4a5a6a;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .from-preview {
            color: #7a8a9a;
            font-size: 0.75rem;
            padding: 0.2rem 0 0.2rem 0.5rem;
            border-left: 2px solid rgba(255, 255, 255, 0.04);
            margin-top: -0.2rem;
            margin-bottom: 0.3rem;
        }

        .from-preview span {
            color: #c8d4e0;
            font-weight: 500;
        }

        .send-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .send-btn {
            background: linear-gradient(145deg, #2a303a, #171b21);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #eaeaea;
            font-weight: 500;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .send-btn:hover {
            background: #353d48;
            transform: scale(0.98);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-msg {
            font-size: 0.75rem;
            color: #7a8a9a;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
        }

        .status-msg.success {
            color: #8ac0a0;
            background: rgba(60, 180, 80, 0.08);
        }

        .status-msg.error {
            color: #dbb0b0;
            background: rgba(180, 60, 60, 0.08);
        }

        /* Modal */
        #apiKeyModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #apiKeyModal.visible {
            display: flex;
        }

        .modal-box {
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 450px;
            width: 90%;
        }

        .modal-box h3 {
            color: #e8e8e8;
            margin-bottom: 0.5rem;
        }

        .modal-box p {
            color: #8a9aaa;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .modal-box input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e8e8e8;
            margin-bottom: 1rem;
            outline: none;
            font-size: 0.9rem;
        }

        .modal-box input:focus {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
        }

        .modal-actions button {
            flex: 1;
            padding: 0.7rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.03);
            color: #e8e8e8;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .modal-actions .save-btn {
            background: linear-gradient(145deg, #2a303a, #171b21);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .modal-actions .save-btn:hover {
            background: #353d48;
        }

        .modal-actions .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .modal-status {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #8aa8c0;
            min-height: 1.2rem;
        }

        /* Detail Overlay */
        #detailOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        #detailOverlay.visible {
            display: flex;
        }

        .detail-box {
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .detail-box .close {
            float: right;
            background: transparent;
            border: none;
            color: #6a7a8a;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 0.5rem;
        }

        .detail-box .close:hover {
            color: #e8e8e8;
        }

        .detail-box .subject {
            color: #ececec;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .detail-box .meta {
            color: #8a9aaa;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .detail-box .meta span {
            color: #c8d4e0;
        }

        .detail-box .body {
            color: #d0d8e0;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 1rem;
                border-radius: 1.5rem;
            }
            .login-box {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            .header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔐 Secure Access</h2>
            <p>Vitamin's Mail · takemyvitamins.lol</p>
            <input type="password" id="passwordInput" placeholder="Enter password" />
            <button id="loginBtn">Unlock</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- Main App -->
    <div class="card" id="mainApp" style="display:none;">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-envelope" style="color:#8aa8c0;"></i> Vitamin's Mail
                <span class="domain-tag">@takemyvitamins.lol</span>
            </h1>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <!-- API Key Bar -->
        <div class="api-bar">
            <div class="status">
                <i class="fas fa-key"></i> API Key: <span class="key-status" id="apiKeyStatus">Not set</span>
            </div>
            <button class="set-key-btn" id="showApiKeyBtn"><i class="fas fa-edit"></i> Set Key</button>
        </div>

        <!-- Grid -->
        <div class="grid">
            <!-- Inbox -->
            <div class="inbox">
                <div class="inbox-header">
                    <h3><i class="fas fa-inbox" style="color:#8aa8c0;"></i> Inbox</h3>
                    <button class="refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
                </div>
                <div class="inbox-tabs">
                    <button class="active" id="tabReceived"><i class="fas fa-arrow-down"></i> Received</button>
                    <button id="tabSent"><i class="fas fa-arrow-up"></i> Sent</button>
                </div>
                <ul class="message-list" id="inboxList">
                    <li class="empty-state">No messages yet</li>
                </ul>
            </div>

            <!-- Compose -->
            <div class="compose">
                <h3><i class="fas fa-pen-fancy" style="color:#8aa8c0;"></i> Compose</h3>
                <form id="sendForm">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="fromName" placeholder="e.g. John" value="John" />
                        <div class="from-preview">
                            Sends as: <span id="fromPreview">John <John@takemyvitamins.lol></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>To</label>
                        <input type="email" id="toEmail" placeholder="recipient@example.com" required />
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="subjectInput" placeholder="Subject" />
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="bodyInput" placeholder="Write your message..."></textarea>
                    </div>
                    <div class="send-row">
                        <span class="status-msg" id="sendStatus"><i class="fas fa-circle" style="font-size:0.3rem; vertical-align:middle; margin-right:4px; color:#5a6a7a;"></i> Ready</span>
                        <button type="submit" class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="apiKeyModal">
        <div class="modal-box">
            <h3><i class="fas fa-key"></i> Set API Key</h3>
            <p>Enter your Resend API key. It will be saved locally.</p>
            <input type="password" id="apiKeyInput" placeholder="re_xxxxxxxxxxxxxxxxxxxx" />
            <div class="modal-actions">
                <button class="save-btn" id="saveApiKeyBtn">Save Key</button>
                <button class="cancel-btn" id="closeApiKeyBtn">Cancel</button>
            </div>
            <div class="modal-status" id="apiKeyStatusMsg"></div>
        </div>
    </div>

    <!-- Detail Overlay -->
    <div id="detailOverlay">
        <div class="detail-box">
            <button class="close" id="detailClose">&times;</button>
            <div class="subject" id="detailSubject">Subject</div>
            <div class="meta">
                <div>From: <span id="detailFrom">—</span></div>
                <div>To: <span id="detailTo">—</span></div>
                <div>Date: <span id="detailDate">—</span></div>
            </div>
            <div class="body" id="detailBody">Email content...</div>
        </div>
    </div>

    <script>
        // =============================================
        // SIMPLE CONFIG
        // =============================================
        const PASSWORD = 'Trumpet70%Azuzws8fcb!';
        const DOMAIN = 'takemyvitamins.lol';
        const RESEND_API_URL = 'https://api.resend.com/emails';
        
        // Load saved data
        let API_KEY = localStorage.getItem('vitamins_api_key') || '';
        let received = JSON.parse(localStorage.getItem('vitamins_received') || '[]');
        let sent = JSON.parse(localStorage.getItem('vitamins_sent') || '[]');
        let nextId = parseInt(localStorage.getItem('vitamins_next_id') || '1000');
        let currentTab = 'received';
        let isLoggedIn = false;

        // =============================================
        // DOM REFS
        // =============================================
        const $ = id => document.getElementById(id);
        const loginOverlay = $('loginOverlay');
        const mainApp = $('mainApp');
        const passwordInput = $('passwordInput');
        const loginBtn = $('loginBtn');
        const loginError = $('loginError');
        const logoutBtn = $('logoutBtn');
        const inboxList = $('inboxList');
        const refreshBtn = $('refreshBtn');
        const sendForm = $('sendForm');
        const fromName = $('fromName');
        const fromPreview = $('fromPreview');
        const toEmail = $('toEmail');
        const subjectInput = $('subjectInput');
        const bodyInput = $('bodyInput');
        const sendStatus = $('sendStatus');
        const sendBtn = $('sendBtn');
        const tabReceived = $('tabReceived');
        const tabSent = $('tabSent');
        const apiKeyStatus = $('apiKeyStatus');
        const showApiKeyBtn = $('showApiKeyBtn');
        const apiKeyModal = $('apiKeyModal');
        const apiKeyInput = $('apiKeyInput');
        const saveApiKeyBtn = $('saveApiKeyBtn');
        const closeApiKeyBtn = $('closeApiKeyBtn');
        const apiKeyStatusMsg = $('apiKeyStatusMsg');
        const detailOverlay = $('detailOverlay');
        const detailClose = $('detailClose');
        const detailSubject = $('detailSubject');
        const detailFrom = $('detailFrom');
        const detailTo = $('detailTo');
        const detailDate = $('detailDate');
        const detailBody = $('detailBody');

        // =============================================
        // HELPERS
        // =============================================
        function saveData() {
            localStorage.setItem('vitamins_received', JSON.stringify(received));
            localStorage.setItem('vitamins_sent', JSON.stringify(sent));
            localStorage.setItem('vitamins_next_id', String(nextId));
        }

        function updateFromPreview() {
            const name = fromName.value.trim() || 'Your Name';
            const email = name.toLowerCase().replace(/\s/g, '.') + '@' + DOMAIN;
            fromPreview.textContent = `${name} <${email}>`;
        }

        function updateApiKeyStatus() {
            if (API_KEY && API_KEY.length > 10) {
                const masked = API_KEY.substring(0, 6) + '••••' + API_KEY.substring(API_KEY.length - 4);
                apiKeyStatus.textContent = masked;
                apiKeyStatus.className = 'key-status set';
            } else {
                apiKeyStatus.textContent = 'Not set';
                apiKeyStatus.className = 'key-status';
            }
        }

        // =============================================
        // LOGIN
        // =============================================
        function doLogin() {
            const pwd = passwordInput.value.trim();
            if (pwd === PASSWORD) {
                loginOverlay.classList.add('hidden');
                mainApp.style.display = 'block';
                loginError.textContent = '';
                passwordInput.value = '';
                isLoggedIn = true;
                renderInbox();
                updateFromPreview();
                updateApiKeyStatus();
            } else {
                loginError.textContent = '❌ Incorrect password. Try again.';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        loginBtn.addEventListener('click', doLogin);

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                doLogin();
            }
        });

        logoutBtn.addEventListener('click', () => {
            mainApp.style.display = 'none';
            loginOverlay.classList.remove('hidden');
            passwordInput.value = '';
            isLoggedIn = false;
            loginError.textContent = '';
            passwordInput.focus();
        });

        // =============================================
        // RENDER INBOX
        // =============================================
        function renderInbox() {
            const messages = currentTab === 'received' ? received : sent;
            
            inboxList.innerHTML = '';
            if (!messages || messages.length === 0) {
                inboxList.innerHTML = `<li class="empty-state">No ${currentTab} messages</li>`;
                return;
            }

            messages.forEach(msg => {
                const li = document.createElement('li');
                const dateDisplay = msg.date ? new Date(msg.date).toLocaleString() : 'just now';
                const displayFrom = currentTab === 'received' ? msg.from : msg.from;
                const displayTo = currentTab === 'received' ? msg.to : msg.to;
                
                li.innerHTML = `
                    <div class="sender">
                        <span>${displayFrom}</span>
                        <small>${dateDisplay}</small>
                    </div>
                    <div class="subject">${msg.subject || '(no subject)'}</div>
                    <div class="preview">${msg.preview || ''}</div>
                    <div class="to-info">${currentTab === 'received' ? 'To: ' : 'To: '} ${displayTo}</div>
                `;
                
                li.addEventListener('click', () => {
                    detailSubject.textContent = msg.subject || '(no subject)';
                    detailFrom.textContent = msg.from || 'unknown';
                    detailTo.textContent = msg.to || 'unknown';
                    detailDate.textContent = msg.date ? new Date(msg.date).toLocaleString() : 'unknown';
                    detailBody.textContent = msg.body || '(empty message)';
                    detailOverlay.classList.add('visible');
                    document.body.style.overflow = 'hidden';
                });
                
                inboxList.appendChild(li);
            });
        }

        // =============================================
        // SEND EMAIL
        // =============================================
        sendForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!API_KEY || API_KEY.length < 10) {
                sendStatus.textContent = '⚠️ Set API key first';
                sendStatus.className = 'status-msg error';
                return;
            }

            const name = fromName.value.trim() || 'Your Name';
            const fromEmail = name.toLowerCase().replace(/\s/g, '.') + '@' + DOMAIN;
            const from = `${name} <${fromEmail}>`;
            const to = toEmail.value.trim();
            const subject = subjectInput.value.trim() || '(no subject)';
            const body = bodyInput.value.trim() || ' ';

            if (!to) {
                sendStatus.textContent = '⚠️ Enter recipient';
                sendStatus.className = 'status-msg error';
                return;
            }

            if (!to.includes('@')) {
                sendStatus.textContent = '⚠️ Enter valid email';
                sendStatus.className = 'status-msg error';
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
            sendStatus.textContent = 'Sending...';
            sendStatus.className = 'status-msg';

            try {
                // Try with CORS proxy first
                const proxyUrl = 'https://corsproxy.io/?';
                const response = await fetch(proxyUrl + encodeURIComponent(RESEND_API_URL), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        from: from,
                        to: [to],
                        subject: subject,
                        text: body,
                        html: `<p>${body.replace(/\n/g, '<br>')}</p>`
                    })
                });

                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.message || 'Failed to send');
                }

                // Add to sent
                sent.unshift({
                    id: nextId++,
                    from: from,
                    to: to,
                    subject: subject,
                    preview: body.substring(0, 60) + (body.length > 60 ? '...' : ''),
                    body: body,
                    date: new Date().toISOString()
                });
                if (sent.length > 50) sent.pop();
                saveData();

                sendStatus.textContent = '✅ Sent!';
                sendStatus.className = 'status-msg success';
                toEmail.value = '';
                subjectInput.value = '';
                bodyInput.value = '';
                renderInbox();

            } catch (err) {
                // If proxy fails, save locally anyway
                sendStatus.textContent = '⚠️ Saved locally (check Resend)';
                sendStatus.className = 'status-msg error';
                
                sent.unshift({
                    id: nextId++,
                    from: from,
                    to: to,
                    subject: subject,
                    preview: body.substring(0, 60) + (body.length > 60 ? '...' : ''),
                    body: body + '\n\n⚠️ Saved locally. Check Resend dashboard to verify delivery.',
                    date: new Date().toISOString()
                });
                if (sent.length > 50) sent.pop();
                saveData();
                renderInbox();
                
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
            }
        });

        // =============================================
        // EVENT LISTENERS
        // =============================================
        // Tabs
        tabReceived.addEventListener('click', () => {
            currentTab = 'received';
            tabReceived.classList.add('active');
            tabSent.classList.remove('active');
            renderInbox();
        });

        tabSent.addEventListener('click', () => {
            currentTab = 'sent';
            tabSent.classList.add('active');
            tabReceived.classList.remove('active');
            renderInbox();
        });

        // Refresh
        refreshBtn.addEventListener('click', () => {
            renderInbox();
            sendStatus.textContent = '🔄 Refreshed';
            sendStatus.className = 'status-msg';
            setTimeout(() => {
                sendStatus.innerHTML = '<i class="fas fa-circle" style="font-size:0.3rem; vertical-align:middle; margin-right:4px; color:#5a6a7a;"></i> Ready';
                sendStatus.className = 'status-msg';
            }, 1000);
        });

        // From name preview
        fromName.addEventListener('input', updateFromPreview);

        // API Key
        showApiKeyBtn.addEventListener('click', () => {
            apiKeyInput.value = API_KEY || '';
            apiKeyModal.classList.add('visible');
            apiKeyStatusMsg.textContent = '';
            apiKeyInput.focus();
        });

        saveApiKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key && key.startsWith('re_') && key.length > 10) {
                API_KEY = key;
                localStorage.setItem('vitamins_api_key', key);
                updateApiKeyStatus();
                apiKeyStatusMsg.textContent = '✅ Key saved!';
                apiKeyStatusMsg.style.color = '#8aa8c0';
                apiKeyModal.classList.remove('visible');
                setTimeout(() => { apiKeyStatusMsg.textContent = ''; }, 2000);
            } else {
                apiKeyStatusMsg.textContent = '⚠️ Invalid key (must start with re_)';
                apiKeyStatusMsg.style.color = '#d4a0a0';
            }
        });

        closeApiKeyBtn.addEventListener('click', () => {
            apiKeyModal.classList.remove('visible');
        });

        apiKeyModal.addEventListener('click', (e) => {
            if (e.target === apiKeyModal) apiKeyModal.classList.remove('visible');
        });

        // Detail close
        detailClose.addEventListener('click', () => {
            detailOverlay.classList.remove('visible');
            document.body.style.overflow = '';
        });

        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) {
                detailOverlay.classList.remove('visible');
                document.body.style.overflow = '';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                detailOverlay.classList.remove('visible');
                document.body.style.overflow = '';
            }
        });

        // =============================================
        // SIMULATE INCOMING EMAILS (for demo)
        // =============================================
        const names = ['john', 'sarah', 'mike', 'lisa', 'david', 'emma', 'alex', 'jessica'];
        const domains = ['gmail.com', 'yahoo.com', 'outlook.com', 'company.com'];
        const subjects = ['Meeting tomorrow', 'Project update', 'Quick question', 'Invoice attached', 'Welcome!', 'Follow up', 'Important notice'];

        setInterval(() => {
            if (isLoggedIn && mainApp.style.display !== 'none') {
                const randomName = names[Math.floor(Math.random() * names.length)];
                const randomDomain = domains[Math.floor(Math.random() * domains.length)];
                const randomUser = ['info', 'support', 'hello', 'team', 'contact', 'admin'][Math.floor(Math.random() * 6)];
                
                received.unshift({
                    id: nextId++,
                    from: `${randomName}@${randomDomain}`,
                    to: `${randomUser}@${DOMAIN}`,
                    subject: subjects[Math.floor(Math.random() * subjects.length)],
                    preview: `Simulated email from ${randomName}@${randomDomain}`,
                    body: `This is a simulated email from ${randomName}@${randomDomain}.\n\nGenerated at ${new Date().toLocaleString()}.\n\nThis demonstrates the catch-all inbox for @${DOMAIN}.`,
                    date: new Date().toISOString()
                });
                if (received.length > 50) received.pop();
                saveData();
                if (currentTab === 'received') renderInbox();
            }
        }, 45000);

        // =============================================
        // INIT
        // =============================================
        updateApiKeyStatus();
        updateFromPreview();
        console.log('🚀 Vitamin\'s Mail ready!');
        console.log('📧 API Key:', API_KEY ? '✓ Set' : '✗ Not set');
        console.log('📨 Messages:', received.length + sent.length);
        console.log('💡 Login with password: Trumpet70%Azuzws8fcb!');
        console.log('💡 Set your API key via the "Set Key" button');
    </script>
</body>
</html>
